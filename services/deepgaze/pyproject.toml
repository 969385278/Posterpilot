[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "posterpilot-deepgaze"
version = "0.1.0"
description = "Isolated DeepGaze attention prediction service for PosterPilot"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<0.120",
  "numpy>=2.0,<3.0",
  "pillow>=11,<13",
  "python-multipart>=0.0.20,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1.0", "pytest>=8.3,<10.0", "ruff>=0.11,<1.0"]
model = ["torch>=2.7,<3.0", "torchvision>=0.22,<1.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
