[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "posterpilot-api"
version = "0.1.0"
description = "FastAPI and LangGraph backend for the PosterPilot optimization agent"
requires-python = ">=3.12"
dependencies = [
  "chromadb>=1.0,<2.0",
  "fastapi>=0.115,<1.0",
  "fonttools>=4.55,<5",
  "httpx>=0.28,<1.0",
  "langchain-chroma>=0.2,<2.0",
  "langchain-core>=0.3,<2.0",
  "langchain-ollama>=0.3,<2.0",
  "langgraph>=0.4,<2.0",
  "langgraph-checkpoint-sqlite>=3.0,<4.0",
  "pillow>=11,<13",
  "pydantic-settings>=2.8,<3.0",
  "pypdf>=5.4,<7.0",
  "pyyaml>=6.0,<7.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10.0",
  "pytest-asyncio>=0.25,<2.0",
  "respx>=0.22,<1.0",
  "ruff>=0.11,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
